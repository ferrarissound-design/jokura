name: Apply phone landscape HUD v2

on:
  push:
    branches:
      - fix/phone-landscape-hud-v2-20260813

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phone-landscape-hud-v2-20260813
          fetch-depth: 0

      - name: Append staged CSS
        shell: bash
        run: |
          if ! grep -q "PHONE_LANDSCAPE_HUD_V2" styles/main.css; then
            cat styles/.phone-landscape-v2.css >> styles/main.css
          fi

      - name: Bust stylesheet cache
        shell: bash
        run: |
          python -c "from pathlib import Path; import re; p=Path('index.html'); s=p.read_text(encoding='utf-8'); s=re.sub(r'styles/main\\.css\\?v=[^\"\\x27]+', 'styles/main.css?v=20260813landscape2', s, count=1); p.write_text(s, encoding='utf-8')"

      - name: Remove temporary patch files
        shell: bash
        run: |
          rm -f styles/.phone-landscape-v2.css
          rm -f .github/workflows/apply-phone-landscape-v2.yml

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: optimize phone landscape HUD across modes"
          git push origin HEAD:fix/phone-landscape-hud-v2-20260813
