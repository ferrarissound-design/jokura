name: Landscape fix v2

on:
  push:
    branches: ["fix/iphone-landscape-hud-20260813"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/iphone-landscape-hud-20260813
          fetch-depth: 0
      - name: Apply CSS patch
        shell: bash
        run: |
          if ! grep -q 'IPHONE_LANDSCAPE_COMPACT_HUD_V1' styles/main.css; then
            echo '' | base64 -d >> styles/main.css
          fi
      - name: Bust CSS cache
        shell: bash
        run: |
          sed -i -E 's#styles/main\.css\?v=[^" ]+#styles/main.css?v=20260813landscape1#' index.html
      - name: Remove temporary workflow
        shell: bash
        run: rm -f .github/workflows/landscape-fix-v2.yml
      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: compact HUD for iPhone landscape'
          git push origin HEAD:fix/iphone-landscape-hud-20260813
